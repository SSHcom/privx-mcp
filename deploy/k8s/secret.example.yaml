# EXAMPLE / TEMPLATE ONLY — do not commit real secret values.
#
# Two common ways to create this Secret:
#
# 1) Preferred (no plaintext file, key stays out of git). Create imperatively:
#
#    kubectl -n privx-mcp create secret generic privx-mcp-secret \
#      --from-file=private-key.pem=/path/to/private-key.pem \
#      --from-literal=PRIVX_API_OAUTH_CLIENT_SECRET='...' \
#      --from-literal=PRIVX_API_CLIENT_ID='...' \
#      --from-literal=PRIVX_API_CLIENT_SECRET='...'
#      # add --from-literal=OAUTH_DCR_STUB_CLIENT_SECRET='...' only if you use the DCR stub
#
# 2) Or copy this file to secret.yaml, fill in the values, and `kubectl apply`.
#    secret.yaml is gitignored (see note in README).
#
# The RSA signing key is exposed to the container as a file (volume mount at
# /etc/privx-mcp/private-key.pem). The remaining keys are injected as env vars
# via envFrom in the Deployment.
apiVersion: v1
kind: Secret
metadata:
  name: privx-mcp-secret
  namespace: privx-mcp
  labels:
    app.kubernetes.io/name: privx-mcp-server
type: Opaque
stringData:
  # RSA private signing key (PEM). Mounted as a file, not an env var.
  private-key.pem: |
    -----BEGIN PRIVATE KEY-----
    REPLACE_WITH_YOUR_PEM_CONTENTS
    -----END PRIVATE KEY-----

  # PrivX API credentials (injected as env vars via envFrom).
  PRIVX_API_OAUTH_CLIENT_SECRET: "REPLACE_ME"
  PRIVX_API_CLIENT_ID: "REPLACE_ME"
  PRIVX_API_CLIENT_SECRET: "REPLACE_ME"

  # Only needed if you use the DCR stub for MCP clients (e.g. Kiro on Entra ID).
  # OAUTH_DCR_STUB_CLIENT_ID: "REPLACE_ME"
  # OAUTH_DCR_STUB_CLIENT_SECRET: "REPLACE_ME"
