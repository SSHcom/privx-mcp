# Machine-to-machine configuration (auth_mode = "m2m-jwt").
# Copy this file, replace the placeholders, and start the server with --config.
# Guide: docs/guide/04-m2m/04-m2m.md
#
# Leave [oauth] unset. This mode rejects issuer_url, audience, jwks_uri, scopes,
# and the DCR stub settings.
# Prefer SERVER_M2M_JWT_KEY so the API key stays out of this file.
# See examples/m2m-jwt.env for the same settings as environment variables.

[server]
name = "privx-mcp-server"
auth_mode = "m2m-jwt"
public_url = "https://mcp.example.net:8181"
log_level = "info"

# Set both when this process terminates TLS. Omit both when a proxy does.
tls_cert_file = "/etc/privx-mcp/mcp-tls-cert.pem"
tls_key_file = "/etc/privx-mcp/mcp-tls-key.pem"

# Shared key of at least 12 characters. Clients send it as X-API-KEY.
# 32 characters is a practical length. The JWT signature is not verified.
m2m_jwt_key = "replace-with-api-key"

# Optional exact match for the JWT iss claim. Empty skips the check.
m2m_jwt_issuer = "https://idp.example.net/realms/example"

# "<claim> <value> <privx username>" entries, separated by "|".
# claim is preferred_username or email. The same username may repeat.
# The same claim and value may not. None of the three fields may contain a space or "|".
m2m_jwt_identity_mapper = "preferred_username user-1 privx-user-1|email user-2@example.com privx-user-2"

[privx_auth]
privx_base_url = "https://privx.example.net"

# Private key for JWTs exchanged with PrivX. Paste the matching public key
# into the external token provider. See docs/reference/server/privx-token-provider.md.
rsa_key_file = "/etc/privx-mcp/private-key.pem"
# Optional startup check that this public key matches rsa_key_file.
rsa_public_key_file = "/etc/privx-mcp/public-key.pem"

# subject_format, rsa_key_id, token_issuer, and audience come from the
# external token provider. See docs/reference/server/privx-token-provider.md.
rsa_key_id = "privx-mcp-key-1"
audience = "privx-mcp-client"
token_issuer = "privx-mcp"
subject_format = "plain"

# API client used to resolve users and roles. The attached role needs
# roles-view and users-view.
api_oauth_client_id = "privx-external"
api_oauth_client_secret = "replace-with-secret"
api_client_id = "replace-with-api-client-id"
api_client_secret = "replace-with-api-client-secret"

# Trust anchor for the API client when PrivX uses a private CA.
# PEM content or a path to a PEM file.
# ca_cert = "/etc/privx-mcp/privx-ca.pem"

[permissions]
default_read_only = true
enable_sensitive_data_tools = false
sensitive_data_tools_allow_non_admin = false
response_filter = ["sudo", "chmod", "chown", "curl", "wget", "ping", "nslookup", "sh", "bash", "zsh", "cmd", "exec", "eval"]

# Users Directory type from the external token provider.
# LOCAL for a local PrivX account, which is the usual machine-to-machine choice.
source_type = "LOCAL"
session_cache_ttl = "30s"
